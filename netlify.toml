# 肘子鱼独立站 · Netlify 静态部署配置
[build]
  publish = "."

# 管理后台只在本机运行（server.py），线上不存在 /api 与 /manage 接口。
# 这里让线上 /manage、/api 及本机脚本一律返回 404，避免出现“假后台”。
[[redirects]]
  from = "/manage"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/manage/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

# 静态资源长缓存：CSS/JS 的 URL 由发布脚本自动带 ?v= 版本号，更新即换 URL
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 不设长缓存：页面每次重新校验，内容更新才能立即可见
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
